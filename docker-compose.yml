version: '3.9'

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

  app:
    build: ./app
    mem_limit: 1g
    env_file:
      - ./app/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=salesguard
      - DB_USER=sguser
      - DB_PASSWORD=sgpass
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=salesguard
      - POSTGRES_USER=sguser
      - POSTGRES_PASSWORD=sgpass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sguser -d salesguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@salesguard.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always

volumes:
  pg_data:
  uploads_data:
