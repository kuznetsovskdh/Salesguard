<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SellerTeller — Sign In</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<canvas id="gravity-canvas"></canvas>
<div class="page-content auth-page">
  <div class="auth-card">
    <div class="auth-logo">SellerTeller</div>
    <div class="auth-subtitle">ANALYTICS PLATFORM</div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:8px">
        Sign In
      </button>
    </form>
    <div class="auth-footer">No account? <a href="/register">Register</a></div>
  </div>
</div>
<script src="/static/gravity.js"></script>
</body>
</html>
