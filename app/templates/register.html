<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SalesGuard — Register</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<canvas id="gravity-canvas"></canvas>
<div class="page-content auth-page">
  <div class="auth-card">
    <div class="auth-logo">SalesGuard</div>
    <div class="auth-subtitle">CREATE ACCOUNT</div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    {% if info %}<div class="alert alert-info">{{ info }}</div>{% endif %}
    <form method="post">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-input" type="password" name="password2" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:8px">
        Create Account
      </button>
    </form>
    <div class="auth-footer">Already have an account? <a href="/login">Sign In</a></div>
  </div>
</div>
<script src="/static/gravity.js"></script>
</body>
</html>
